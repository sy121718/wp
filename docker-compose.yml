# docker-compose.yml — 本地开发依赖（审计 OSS-012）。
#
# 只起**依赖**（PostgreSQL + Redis），应用本身用 `make dev` 在宿主机跑：
# 开发期热重载需要文件系统监听与快速的编译反馈，把应用塞进容器只会
# 让「改一行代码看效果」变成两次构建。容器化整个应用是部署话题，不是开发话题。
#
# 凭据与 config.yaml 的默认值对齐（root / root，Redis 无密码），
# 这样 clone 下来 `docker compose up -d && make migrate && make dev` 就能跑，
# 不需要先改配置。生产环境当然不能用这套。
services:
  postgres:
    image: postgres:18-alpine
    container_name: gowp-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wp
      # 分区表与 timestamptz 的行为对时区敏感，固定成 UTC 与生产一致
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - gowp-pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 pg_isready 而不是 psql：后者要凭据，健康检查不该依赖业务账号
      test: ["CMD-SHELL", "pg_isready -U root -d wp"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gowp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gowp-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  gowp-pgdata:
  gowp-redisdata:
