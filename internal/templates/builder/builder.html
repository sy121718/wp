{* builder.html — Elementor 式可视化页面构建器 *}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面构建器 — go_wp</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/builder/css/builder.css?v=builder-ui-2">
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
<div x-data="builderApp" x-init="init()" class="builder-layout">
    <header class="builder-toolbar">
        <div class="toolbar-left">
            <a href="/" class="toolbar-back">← 返回</a>
            <span class="toolbar-title">页面构建器</span>
        </div>
        <div class="toolbar-center">
            <button class="btn btn-ghost btn-sm" @click="togglePanelLeft"
                    :title="panelLeftVisible ? '隐藏编辑面板' : '显示编辑面板'">
                <span x-text="panelLeftVisible ? '▣' : '▢'"></span> 编辑
            </button>
            <button class="btn btn-ghost btn-sm" @click="togglePanelRight"
                    :title="panelRightVisible ? '隐藏结构面板' : '显示结构面板'">
                <span x-text="panelRightVisible ? '▣' : '▢'"></span> 结构
            </button>
        </div>
        <div class="toolbar-right">
            <span class="toolbar-notice" x-show="notice" x-text="notice"></span>
            <button class="btn btn-ghost btn-sm" @click="toggleTheme">主题</button>
            <button class="btn btn-secondary btn-sm" @click="undo" :disabled="!canUndo">撤销</button>
            <button class="btn btn-secondary btn-sm" @click="redo" :disabled="!canRedo">重做</button>
            <button class="btn btn-secondary btn-sm" @click="save">保存</button>
            <button class="btn btn-secondary btn-sm" @click="load">加载</button>
            <button class="btn btn-secondary btn-sm" @click="exportJSON">导出</button>
            <button class="btn btn-primary btn-sm" @click="generateAndVisit" :disabled="isGenerating"
                    x-text="isGenerating ? '生成中…' : '生成并访问'"></button>
            <button class="btn btn-primary btn-sm" @click="clearAll">清空</button>
        </div>
    </header>

    <div class="builder-body" :class="{ 'panel-l-hidden': !panelLeftVisible, 'panel-r-hidden': !panelRightVisible }">
        <div class="panel-l-wrap">
            <aside class="builder-panel">
                <div class="panel-header">
                    <template x-if="panelMode === 'add'">
                        <span class="panel-header-label">组件库</span>
                    </template>
                    <template x-if="panelMode === 'page'">
                        <span class="panel-header-label">页面设置</span>
                    </template>
                    <template x-if="panelMode === 'edit' && selectedNode">
                        <div class="panel-header-label">
                            <span class="badge badge-mute" x-text="inspectorIcon(selectedNode)"></span>
                            <span x-text="inspectorLabel(selectedNode)"></span>
                        </div>
                    </template>
                    <div class="panel-header-actions">
                        <button class="btn-icon-sm" @click="switchPanelMode('page')"
                                :class="{ active: panelMode === 'page' }" title="页面设置">设</button>
                        <button class="btn-icon-sm" @click="switchPanelMode('add')"
                                :class="{ active: panelMode === 'add' }" title="添加组件">+</button>
                    </div>
                </div>

                <template x-if="panelMode === 'add'">
                    <div class="panel-content">
                        <template x-for="cat in categories" :key="cat.name">
                            <div class="panel-section">
                                <div class="panel-section-title" x-text="cat.label"></div>
                                <div class="component-list" :data-category="cat.name">
                                    <template x-for="comp in componentsFor(cat.name)" :key="comp.key">
                                        <div class="component-item" :data-component-key="comp.key" draggable="true"
                                             @dragstart="onDragStart($event, comp.key)"
                                             @click="addComponentDirectly(comp.key)">
                                            <span class="component-icon" x-text="comp.icon"></span>
                                            <span x-text="comp.label"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="panelMode === 'page'">
                    <div class="panel-content page-settings-panel">
                        <section class="page-settings-group">
                            <div class="page-settings-title">基本信息</div>
                            <div class="form-group">
                                <label class="form-label">页面名称</label>
                                <input class="form-input" type="text" :value="pageSettingValue('general', 'name')"
                                       @input="updatePageSetting('general', 'name', $event.target.value)" placeholder="用于管理和识别页面">
                            </div>
                            <div class="form-group">
                                <label class="form-label">浏览器标题</label>
                                <input class="form-input" type="text" :value="pageSettingValue('general', 'title')"
                                       @input="updatePageSetting('general', 'title', $event.target.value)" placeholder="显示在浏览器标签页">
                            </div>
                            <div class="form-group">
                                <label class="form-label">页面描述</label>
                                <textarea class="form-input" :value="pageSettingValue('general', 'description')"
                                          @input="updatePageSetting('general', 'description', $event.target.value)" placeholder="用于 meta description"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">页面图标</label>
                                <input class="form-input" type="url" :value="pageSettingValue('general', 'favicon')"
                                       @input="updatePageSetting('general', 'favicon', $event.target.value)" placeholder="https://example.com/favicon.ico">
                            </div>
                            <div class="form-group">
                                <label class="form-label">页面模板</label>
                                <select class="form-select" :value="pageSettingValue('general', 'template')"
                                        @change="updatePageSetting('general', 'template', $event.target.value)">
                                    <option value="default">主题默认（内容居中容器）</option>
                                    <option value="full-width">全宽（无内容宽度限制）</option>
                                    <option value="canvas">画布（无容器，纯内容）</option>
                                </select>
                            </div>
                            <label class="preview-code-toggle">
                                <input type="checkbox" :checked="pageSettingValue('general', 'hideTitle')"
                                       @change="updatePageSetting('general', 'hideTitle', $event.target.checked)">
                                <span>隐藏页面标题</span>
                            </label>
                        </section>

                        <section class="page-settings-group">
                            <div class="page-settings-title">内容布局</div>
                            <div class="form-group">
                                <label class="form-label">内容最大宽度</label>
                                <input class="form-input" type="text" :value="pageSettingValue('layout', 'contentWidth')"
                                       @input="updatePageSetting('layout', 'contentWidth', $event.target.value)" placeholder="1140px / 90vw">
                            </div>
                            <div class="form-group">
                                <label class="form-label">内容对齐</label>
                                <div class="radio-group">
                                    <button class="radio-btn" :class="{ active: pageSettingValue('layout', 'alignment') === 'left' }"
                                            @click="updatePageSetting('layout', 'alignment', 'left')">左对齐</button>
                                    <button class="radio-btn" :class="{ active: pageSettingValue('layout', 'alignment') === 'center' }"
                                            @click="updatePageSetting('layout', 'alignment', 'center')">居中</button>
                                    <button class="radio-btn" :class="{ active: pageSettingValue('layout', 'alignment') === 'right' }"
                                            @click="updatePageSetting('layout', 'alignment', 'right')">右对齐</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">页面最小高度</label>
                                <input class="form-input" type="text" :value="pageSettingValue('layout', 'minHeight')"
                                       @input="updatePageSetting('layout', 'minHeight', $event.target.value)" placeholder="100vh">
                            </div>
                            <div class="form-group">
                                <label class="form-label">组件间距</label>
                                <input class="form-input" type="text" :value="pageSettingValue('layout', 'spaceBetweenWidgets')"
                                       @input="updatePageSetting('layout', 'spaceBetweenWidgets', $event.target.value)" placeholder="20px">
                            </div>
                        </section>

                        <section class="page-settings-group">
                            <div class="page-settings-title">页面样式</div>
                            <div class="form-group">
                                <label class="form-label">外边距</label>
                                <div class="dimensions-control">
                                    <div class="dimensions-values">
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'margin', 'Top')"
                                                   @input="updatePageDimension('style', 'margin', 'Top', $event.target.value)">
                                            <span>上</span>
                                        </label>
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'margin', 'Right')"
                                                   @input="updatePageDimension('style', 'margin', 'Right', $event.target.value)">
                                            <span>右</span>
                                        </label>
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'margin', 'Bottom')"
                                                   @input="updatePageDimension('style', 'margin', 'Bottom', $event.target.value)">
                                            <span>下</span>
                                        </label>
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'margin', 'Left')"
                                                   @input="updatePageDimension('style', 'margin', 'Left', $event.target.value)">
                                            <span>左</span>
                                        </label>
                                    </div>
                                    <div class="dimensions-meta">
                                        <select class="form-select" :value="pageSettingValue('style', 'marginUnit')"
                                                @change="updatePageSetting('style', 'marginUnit', $event.target.value)">
                                            <option value="px">px</option>
                                            <option value="%">%</option>
                                            <option value="em">em</option>
                                            <option value="rem">rem</option>
                                            <option value="vw">vw</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">内边距</label>
                                <div class="dimensions-control">
                                    <div class="dimensions-values">
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'padding', 'Top')"
                                                   @input="updatePageDimension('style', 'padding', 'Top', $event.target.value)">
                                            <span>上</span>
                                        </label>
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'padding', 'Right')"
                                                   @input="updatePageDimension('style', 'padding', 'Right', $event.target.value)">
                                            <span>右</span>
                                        </label>
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'padding', 'Bottom')"
                                                   @input="updatePageDimension('style', 'padding', 'Bottom', $event.target.value)">
                                            <span>下</span>
                                        </label>
                                        <label class="dimension-side">
                                            <input type="number" step="any" :value="pageDimensionValue('style', 'padding', 'Left')"
                                                   @input="updatePageDimension('style', 'padding', 'Left', $event.target.value)">
                                            <span>左</span>
                                        </label>
                                    </div>
                                    <div class="dimensions-meta">
                                        <select class="form-select" :value="pageSettingValue('style', 'paddingUnit')"
                                                @change="updatePageSetting('style', 'paddingUnit', $event.target.value)">
                                            <option value="px">px</option>
                                            <option value="%">%</option>
                                            <option value="em">em</option>
                                            <option value="rem">rem</option>
                                            <option value="vw">vw</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">背景颜色</label>
                                <div class="color-input-wrap">
                                    <input class="color-swatch" type="color" :value="pageSettingValue('style', 'backgroundColor')"
                                           @input="updatePageSetting('style', 'backgroundColor', $event.target.value)">
                                    <input class="form-input" type="text" :value="pageSettingValue('style', 'backgroundColor')"
                                           @input="updatePageSetting('style', 'backgroundColor', $event.target.value)" placeholder="#ffffff">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">背景图片</label>
                                <div class="url-input-wrap">
                                    <input class="form-input" type="url" :value="pageSettingValue('style', 'backgroundImage')"
                                           @input="updatePageSetting('style', 'backgroundImage', $event.target.value)" placeholder="https://example.com/bg.jpg">
                                    <button class="btn-icon-sm media-picker-btn" type="button"
                                            @click="openPageMediaPicker('backgroundImage')" title="从媒体库选择">🖼</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">背景位置</label>
                                <select class="form-select" :value="pageSettingValue('style', 'backgroundPosition')"
                                        @change="updatePageSetting('style', 'backgroundPosition', $event.target.value)">
                                    <option value="center center">居中</option>
                                    <option value="top left">左上</option>
                                    <option value="top center">上中</option>
                                    <option value="top right">右上</option>
                                    <option value="center left">左中</option>
                                    <option value="center right">右中</option>
                                    <option value="bottom left">左下</option>
                                    <option value="bottom center">下中</option>
                                    <option value="bottom right">右下</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">背景重复</label>
                                <select class="form-select" :value="pageSettingValue('style', 'backgroundRepeat')"
                                        @change="updatePageSetting('style', 'backgroundRepeat', $event.target.value)">
                                    <option value="no-repeat">不重复</option>
                                    <option value="repeat">重复</option>
                                    <option value="repeat-x">水平重复</option>
                                    <option value="repeat-y">垂直重复</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">背景尺寸</label>
                                <select class="form-select" :value="pageSettingValue('style', 'backgroundSize')"
                                        @change="updatePageSetting('style', 'backgroundSize', $event.target.value)">
                                    <option value="cover">覆盖（cover）</option>
                                    <option value="contain">包含（contain）</option>
                                    <option value="auto">原始尺寸（auto）</option>
                                </select>
                            </div>
                        </section>

                        <section class="page-settings-group">
                            <div class="page-settings-title">高级</div>
                            <div class="code-warning">代码只在隔离预览 iframe 和发布产物中生效，不会在构建器主页面执行。</div>
                            <div class="form-group">
                                <label class="form-label">自定义 CSS</label>
                                <textarea class="form-input code-input" :value="pageSettingValue('advanced', 'css')"
                                          @input="updatePageSetting('advanced', 'css', $event.target.value)" placeholder=".page-shell { ... }"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Head 代码</label>
                                <textarea class="form-input code-input" :value="pageSettingValue('advanced', 'head')"
                                          @input="updatePageSetting('advanced', 'head', $event.target.value)" placeholder="meta、link 或第三方脚本"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Body 末尾代码</label>
                                <textarea class="form-input code-input" :value="pageSettingValue('advanced', 'bodyEnd')"
                                          @input="updatePageSetting('advanced', 'bodyEnd', $event.target.value)" placeholder="页面末尾 HTML 或脚本"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">JavaScript</label>
                                <textarea class="form-input code-input code-input-lg" :value="pageSettingValue('advanced', 'javascript')"
                                          @input="updatePageSetting('advanced', 'javascript', $event.target.value)" placeholder="console.log('page ready')"></textarea>
                            </div>
                            <label class="preview-code-toggle">
                                <input type="checkbox" :checked="pageSettingValue('advanced', 'previewEnabled')"
                                       @change="updatePageSetting('advanced', 'previewEnabled', $event.target.checked)">
                                <span>在隔离预览中执行 JavaScript</span>
                            </label>
                            <div class="code-error" x-show="pageCodeError" x-text="pageCodeError"></div>
                        </section>
                    </div>
                </template>

                {* 所有节点共用同一套标签、分组和动态控件协议。 *}
                <template x-if="panelMode === 'edit' && selectedNode">
                    <div class="panel-content panel-content-tabs">
                        <div class="editor-tabs">
                            <template x-for="tab in inspectorTabs" :key="tab.key">
                                <button class="editor-tab" :class="{ active: editorTab === tab.key }"
                                        @click="editorTab = tab.key" x-text="tab.label"></button>
                            </template>
                        </div>
                        <div class="tab-panel">
                            <template x-for="group in inspectorGroups" :key="group.name">
                                <section class="style-group">
                                    <div class="style-group-title" x-text="group.label"></div>
                                    <template x-for="field in group.fields" :key="field.key">
                                        <div class="form-group">
                                            <label class="form-label" x-text="field.label"></label>

                                            <template x-if="field.type === 'text' || field.type === 'url'">
                                                <div class="url-input-wrap">
                                                    <input class="form-input" :type="field.type === 'url' ? 'url' : 'text'"
                                                           :value="controlValue(field)"
                                                           @input="updateControl(field, $event.target.value)"
                                                           :placeholder="field.placeholder">
                                                    <template x-if="field.type === 'url'">
                                                        <button class="btn-icon-sm media-picker-btn" type="button"
                                                                @click="openMediaPicker(field)" title="从媒体库选择">🖼</button>
                                                    </template>
                                                </div>
                                            </template>
                                            <template x-if="field.type === 'textarea'">
                                                <textarea class="form-input" :value="controlValue(field)"
                                                          @input="updateControl(field, $event.target.value)"
                                                          :placeholder="field.placeholder"></textarea>
                                            </template>
                                            <template x-if="field.type === 'wysiwyg'">
                                                <div class="wysiwyg-control">
                                                    <div class="wysiwyg-toolbar" role="toolbar" aria-label="富文本工具栏">
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'bold')" title="加粗"><b>B</b></button>
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'italic')" title="斜体"><i>I</i></button>
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'underline')" title="下划线"><u>U</u></button>
                                                        <span class="wysiwyg-divider"></span>
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'insertUnorderedList')" title="无序列表">☰</button>
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'insertOrderedList')" title="有序列表">≡</button>
                                                        <span class="wysiwyg-divider"></span>
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'createLink')" title="插入链接">🔗</button>
                                                        <button type="button" @mousedown.prevent="wysiwygExec(field, 'removeFormat')" title="清除格式">Tx</button>
                                                    </div>
                                                    <div class="wysiwyg-editor" contenteditable="true"
                                                         :data-field-key="field.key"
                                                         x-init="wysiwygSync(field, $el)"
                                                         @input="wysiwygInput(field, $event)"
                                                         :data-placeholder="field.placeholder"></div>
                                                </div>
                                            </template>
                                            <template x-if="field.type === 'checkbox'">
                                                <label class="inspector-checkbox">
                                                    <input type="checkbox" :checked="controlValue(field) === true"
                                                           @change="updateControl(field, $event.target.checked)">
                                                    <span>启用</span>
                                                </label>
                                            </template>
                                            <template x-if="field.type === 'repeater'">
                                                <div class="repeater-control">
                                                    <template x-for="(item, itemIndex) in repeaterItems(field)" :key="itemIndex">
                                                        <div class="repeater-item">
                                                            <div class="repeater-item-head">
                                                                <span x-text="(field.itemLabel || '项目') + ' ' + (itemIndex + 1)"></span>
                                                                <div class="repeater-item-actions">
                                                                    <button @click="moveRepeaterItem(field, itemIndex, -1)" title="上移" :disabled="itemIndex === 0">↑</button>
                                                                    <button @click="moveRepeaterItem(field, itemIndex, 1)" title="下移" :disabled="itemIndex === repeaterItems(field).length - 1">↓</button>
                                                                    <button @click="removeRepeaterItem(field, itemIndex)" title="删除">×</button>
                                                                </div>
                                                            </div>
                                                            <template x-for="subField in (field.fields || [])" :key="subField.key">
                                                                <div class="form-group form-group-compact">
                                                                    <label class="form-label form-label-sm" x-text="subField.label"></label>
                                                                    <template x-if="subField.type === 'text' || subField.type === 'url'">
                                                                        <div class="url-input-wrap">
                                                                            <input class="form-input form-input-sm" :type="subField.type === 'url' ? 'url' : 'text'"
                                                                                   :value="item[subField.key] || ''"
                                                                                   @input="updateRepeaterItemField(field, itemIndex, subField.key, $event.target.value)"
                                                                                   :placeholder="subField.placeholder">
                                                                            <template x-if="subField.type === 'url'">
                                                                                <button class="btn-icon-sm media-picker-btn" type="button"
                                                                                        @click="openMediaPicker(field, itemIndex, subField)" title="从媒体库选择">🖼</button>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                    <template x-if="subField.type === 'textarea'">
                                                                        <textarea class="form-input form-input-sm"
                                                                                  :value="item[subField.key] || ''"
                                                                                  @input="updateRepeaterItemField(field, itemIndex, subField.key, $event.target.value)"
                                                                                  :placeholder="subField.placeholder"></textarea>
                                                                    </template>
                                                                    <template x-if="subField.type === 'select'">
                                                                        <select class="form-select form-select-sm"
                                                                                :value="item[subField.key] || ''"
                                                                                @change="updateRepeaterItemField(field, itemIndex, subField.key, $event.target.value)">
                                                                            <template x-for="opt in subField.options" :key="opt.value">
                                                                                <option :value="opt.value" x-text="opt.label"></option>
                                                                            </template>
                                                                        </select>
                                                                    </template>
                                                                    <template x-if="subField.type === 'number'">
                                                                        <input class="form-input form-input-sm" type="number" step="any"
                                                                               :value="item[subField.key] || ''"
                                                                               @input="updateRepeaterItemField(field, itemIndex, subField.key, $event.target.value)"
                                                                               :placeholder="subField.placeholder">
                                                                    </template>
                                                                    <template x-if="subField.type === 'checkbox'">
                                                                        <label class="inspector-checkbox">
                                                                            <input type="checkbox" :checked="item[subField.key] === true"
                                                                                   @change="updateRepeaterItemField(field, itemIndex, subField.key, $event.target.checked)">
                                                                            <span>启用</span>
                                                                        </label>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <button class="repeater-add" @click="addRepeaterItem(field)" x-text="'添加' + (field.itemLabel || '项目')"></button>
                                                </div>
                                            </template>
                                            <template x-if="field.type === 'number'">
                                                <input class="form-input" type="number" step="any"
                                                       :value="controlValue(field)"
                                                       @input="updateControl(field, $event.target.value)"
                                                       :placeholder="field.placeholder">
                                            </template>
                                            <template x-if="field.type === 'select'">
                                                <select class="form-select" :value="controlValue(field)"
                                                        @change="updateControl(field, $event.target.value)">
                                                    <template x-for="opt in field.options" :key="opt.value">
                                                        <option :value="opt.value" x-text="opt.label"></option>
                                                    </template>
                                                </select>
                                            </template>
                                            <template x-if="field.type === 'color'">
                                                <div class="color-input-wrap">
                                                    <input type="color" class="color-swatch" :value="controlColorValue(field)"
                                                           @input="updateControl(field, $event.target.value)">
                                                    <input class="form-input" type="text" :value="controlValue(field)"
                                                           @input="updateControl(field, $event.target.value)"
                                                           :placeholder="field.placeholder">
                                                </div>
                                            </template>
                                            <template x-if="field.type === 'segmented'">
                                                <div class="radio-group">
                                                    <template x-for="opt in field.options" :key="opt.value">
                                                        <button class="radio-btn"
                                                                :class="{ active: controlValue(field) === opt.value }"
                                                                @click="updateControl(field, opt.value)"
                                                                x-text="opt.label"></button>
                                                    </template>
                                                </div>
                                            </template>
                                            <template x-if="field.type === 'length'">
                                                <div class="length-input-wrap">
                                                    <input class="form-input length-number" type="number" step="any"
                                                           :min="field.min" :value="lengthNumber(field)"
                                                           @input="updateLengthNumber(field, $event.target.value)"
                                                           :placeholder="field.placeholder">
                                                    <select class="form-select length-unit" :value="lengthUnit(field)"
                                                            @change="updateLengthUnit(field, $event.target.value)">
                                                        <template x-for="unit in field.units" :key="unit">
                                                            <option :value="unit" x-text="unit"></option>
                                                        </template>
                                                    </select>
                                                </div>
                                            </template>
                                            <template x-if="field.type === 'dimensions'">
                                                <div class="dimensions-control">
                                                    <div class="dimensions-values">
                                                        <template x-for="side in dimensionSides" :key="side.key">
                                                            <label class="dimension-side">
                                                                <input type="number" step="any" :min="field.allowNegative ? null : 0"
                                                                       :value="dimensionNumber(field, side.key)"
                                                                       @input="updateDimensionNumber(field, side.key, $event.target.value)">
                                                                <span x-text="side.label"></span>
                                                            </label>
                                                        </template>
                                                    </div>
                                                    <div class="dimensions-meta">
                                                        <select class="form-select" :value="dimensionUnit(field)"
                                                                @change="updateDimensionUnit(field, $event.target.value)">
                                                            <template x-for="unit in field.units" :key="unit">
                                                                <option :value="unit" x-text="unit"></option>
                                                            </template>
                                                        </select>
                                                        <button class="dimension-link" :class="{ active: dimensionLinked(field) }"
                                                                @click="toggleDimensionLink(field)"
                                                                :title="dimensionLinked(field) ? '取消四边联动' : '联动四边'">链</button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </section>
                            </template>
                            <div class="inspector-actions">
                                <button class="btn btn-danger btn-sm" @click="deleteSelected()">删除</button>
                                <button class="btn btn-secondary btn-sm" @click="duplicateSelected()">复制</button>
                            </div>
                        </div>
                    </div>
                </template>

                <template x-if="panelMode === 'edit' && !selectedNode">
                    <div class="panel-content">
                        <div class="inspector-empty"><p>点击画布中的组件，或切换到组件库添加新组件</p></div>
                    </div>
                </template>
            </aside>
        </div>

        <button class="panel-toggle panel-toggle-left" @click="togglePanelLeft"
                :title="panelLeftVisible ? '收起编辑面板' : '展开编辑面板'">
            <span x-text="panelLeftVisible ? '◀' : '▶'"></span>
        </button>

        <main class="builder-canvas">
            <div class="canvas-header">
                <span class="canvas-label">预览</span>
                <div class="preview-devices" aria-label="预览设备">
                    <template x-for="device in previewDevices" :key="device.key">
                        <button class="preview-device" :class="{ active: previewDevice === device.key }"
                                @click="setPreviewDevice(device.key)" x-text="device.label"></button>
                    </template>
                </div>
                <span class="canvas-info" x-show="selectedId" x-text="'已选中: ' + selectedId"></span>
            </div>
            <div class="canvas-dropzone" :class="'preview-device--' + previewDevice"
                 @dragover.prevent @drop.prevent="onCanvasDrop($event)" @click="onCanvasClick($event)">
                <iframe x-ref="preview" class="preview-frame" sandbox="allow-scripts"></iframe>
            </div>
        </main>

        <button class="panel-toggle panel-toggle-right" @click="togglePanelRight"
                :title="panelRightVisible ? '收起结构面板' : '展开结构面板'">
            <span x-text="panelRightVisible ? '▶' : '◀'"></span>
        </button>

        <div class="panel-r-wrap">
            <aside class="builder-structure">
                <div class="panel-header">
                    结构
                    <span class="text-mute text-xs" x-show="structureItems.length"
                          x-text="structureItems.length + ' 个节点'"></span>
                </div>
                <div class="panel-content">
                    <template x-if="structureItems.length === 0">
                        <div class="inspector-empty"><p>页面为空，从组件库添加组件</p></div>
                    </template>
                    <div class="structure-tree" x-ref="structureTree">
                        <template x-for="item in structureItems" :key="item.id">
                            <div class="structure-item"
                                 :class="{ 'is-selected': item.id === selectedId, 'is-container': item.isContainer, 'is-root': item.depth === 0 }"
                                 :style="'padding-left: ' + (16 + item.depth * 20) + 'px'"
                                 @click.stop="selectStructureNode(item.id)" :data-node-id="item.id"
                                 :data-depth="item.depth"
                                 :title="item.depth === 0 ? '' : '上下拖动排序，左右拖动调整层级'">
                                <span class="structure-item-expand" x-show="item.isContainer && item.hasChildren"
                                      @click.stop="toggleExpand(item.id)"
                                      x-text="expandedItems[item.id] ? '▼' : '▶'"></span>
                                <span class="structure-item-icon" x-text="item.icon"></span>
                                <span class="structure-item-label" x-text="item.label"></span>
                                <span class="structure-item-id text-mute text-xs" x-text="item.id.slice(0,6)"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    {* 媒体库选择器弹窗：url 字段旁的 🖼 按钮触发 *}
    <div class="media-picker-overlay" x-show="mediaPickerOpen" x-cloak
         @click.self="mediaPickerOpen = false">
        <div class="media-picker" @keydown.escape.window="mediaPickerOpen = false">
            <div class="media-picker-header">
                <span class="media-picker-title">媒体库</span>
                <button class="btn-icon-sm" type="button" @click="mediaPickerOpen = false">×</button>
            </div>
            <div class="media-picker-upload">
                <input type="file" class="media-picker-file" x-ref="mediaFileInput"
                       accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"
                       @change="uploadMedia($event)">
                <button class="btn btn-secondary btn-sm" type="button"
                        @click="$refs.mediaFileInput.click()" :disabled="mediaUploading"
                        x-text="mediaUploading ? '上传中…' : '上传文件'"></button>
                <span class="text-mute text-xs" x-show="mediaPickerTarget && mediaPickerTarget.multi">点击图片添加到图库，可重复选择同一张</span>
            </div>
            <div class="media-picker-grid" x-show="mediaItems.length > 0">
                <template x-for="item in mediaItems" :key="item.id">
                    <div class="media-item" :class="{ 'is-image': item.file_type === 'image' }"
                         @click="selectMedia(item)" :title="item.file_name">
                        <img x-show="item.file_type === 'image'" :src="item.url" :alt="item.file_name" loading="lazy">
                        <div class="media-item-thumb" x-show="item.file_type !== 'image'">
                            <span x-text="mediaTypeBadge(item.file_type)"></span>
                        </div>
                        <div class="media-item-meta">
                            <span class="media-item-name" x-text="item.file_name"></span>
                        </div>
                        <button class="media-item-delete" type="button" @click.stop="deleteMedia(item.id)" title="删除">×</button>
                    </div>
                </template>
            </div>
            <div class="media-picker-empty" x-show="mediaItems.length === 0 && !mediaUploading">
                暂无媒体，点击上方「上传文件」添加
            </div>
            <div class="media-picker-footer">
                <span class="text-mute text-xs">
                    <template x-if="mediaPickerTarget && mediaPickerTarget.multi">
                        <span>已添加 <b x-text="mediaPickerAdded"></b> 张，点击图片继续添加</span>
                    </template>
                    <template x-if="!mediaPickerTarget || !mediaPickerTarget.multi">
                        <span>共 <b x-text="mediaTotal"></b> 个文件</span>
                    </template>
                </span>
                <div class="media-picker-pager">
                    <button class="btn btn-ghost btn-sm" type="button" @click="loadMediaPage(mediaPage - 1)"
                            :disabled="mediaPage <= 1">上一页</button>
                    <span class="text-mute text-xs" x-text="mediaPage + ' / ' + mediaTotalPages"></span>
                    <button class="btn btn-ghost btn-sm" type="button" @click="loadMediaPage(mediaPage + 1)"
                            :disabled="mediaPage >= mediaTotalPages">下一页</button>
                    <button class="btn btn-primary btn-sm" type="button"
                            @click="mediaPickerOpen = false"
                            x-text="(mediaPickerTarget && mediaPickerTarget.multi) ? '完成' : '关闭'"></button>
                </div>
            </div>
        </div>
    </div>
</div>
