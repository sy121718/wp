{{fill := isset(.FormEcho)}}
{{csrf := .["csrf_token"]}}
{{tr := .["t"]}}
{{echo := map()}}
{{if fill}}{{echo = .FormEcho}}{{end}}
<div data-inventory-reason-host>
    {{if isset(.SubmitErr)}}<p class="badge badge-warning" role="alert">{{.SubmitErr}}</p>{{end}}
    <form method="post" action="/admin/inventory/reason/create" class="form-stack"
          hx-post="/admin/inventory/reason/create" hx-target="closest [data-inventory-reason-host]" hx-swap="outerHTML">
        <input type="hidden" name="csrf_token" value="{{csrf}}">
        <input type="hidden" name="projectId" value="{{if fill}}{{echo.projectId}}{{else}}{{.SelectedProject}}{{end}}">
        <div class="form-group">
            <label class="form-label req">{{tr("admin.inventory.reasons.labelCode", "原因 code")}}</label>
            <input type="text" class="form-input" name="code" value="{{if fill}}{{echo.code}}{{end}}" required autocomplete="off">
        </div>
        <div class="form-group">
            <label class="form-label req">{{tr("admin.inventory.reasons.labelName", "原因名称")}}</label>
            <input type="text" class="form-input" name="name" value="{{if fill}}{{echo.name}}{{end}}" required>
        </div>
        <div class="form-group">
            <label class="form-label req">{{tr("admin.inventory.moves.col.direction", "方向")}}</label>
            <select class="form-select" name="direction" required>
                {{range _, d := .Directions}}<option value="{{d.Value}}" {{if fill}}{{if d.Value == echo.direction}}selected{{end}}{{end}}>{{d.Label}}</option>{{end}}
            </select>
        </div>
        <div class="form-group"><label class="form-label">{{tr("admin.inventory.ph.sort", "排序")}}</label>
            <input type="number" class="form-input" name="sort" value="{{if fill}}{{echo.sort}}{{else}}0{{end}}" inputmode="numeric" step="1"></div>
        <div class="action-row">
            <button type="button" class="btn btn-ghost" data-drawer-close>{{tr("admin.common.action.cancel", "取消")}}</button>
            <button type="submit" class="btn btn-primary">{{tr("admin.inventory.reasons.create", "新建自定义原因")}}</button>
        </div>
    </form>
</div>
