
{{vfTr := .["t"]}}
        <div data-write-host>
        <form data-write="custom" data-write-url="/api/product/attribute/set-values" class="form-stack" data-attr-values-form
              data-write-json="values"
              data-msg-ok="{{vfTr("admin.product_attributes.values.saved", "属性值已保存。")}}"
              data-msg-failed="{{vfTr("MsgInternalError", "系统内部错误，请稍后重试")}}">
            <input type="hidden" name="projectId" value="{{.Project}}">
            <input type="hidden" name="id" value="{{.Entity.ID}}">

            <div class="attr-values" id="attr-values-{{.Entity.ID}}">
                {{include "product_attribute_rows.html" map("Values", .Entity.Values, "t", vfTr)}}
            </div>
            <div class="action-row">
                <button type="button" class="btn btn-ghost" data-drawer-close>{{vfTr("admin.common.action.cancel", "取消")}}</button>
                <button data-requires-js hidden type="submit" class="btn btn-primary">{{vfTr("admin.product_attributes.list.saveValues", "保存属性值")}}</button>
            </div>
        </form>
        <p class="form-hint" data-write-status role="status" hidden></p>
        </div>
