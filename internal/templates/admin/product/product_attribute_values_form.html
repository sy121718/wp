
{{vfTr := .["t"]}}
        <div data-write-host>
        <form data-write hx-post="/api/product/attribute/set-values" hx-target="find [data-write-result]" hx-swap="innerHTML" hx-sync="this:drop" hx-disable="findAll button:not(:disabled)" data-write-close="[data-drawer]" data-write-builder="product-attribute-values" class="form-stack" data-attr-values-form>
            <div data-write-result></div>
            <p class="form-hint">{{vfTr("attrValsSaved", "属性值已保存。")}}</p>
            <input type="hidden" name="projectId" value="{{.Project}}">
            <input type="hidden" name="id" value="{{.Entity.ID}}">

            <div class="attr-values" id="attr-values-{{.Entity.ID}}">
                {{include "product_attribute_rows.html" map("Values", .Entity.Values, "t", vfTr)}}
            </div>
            <div class="action-row">
                <button type="button" class="btn btn-ghost" data-drawer-close>{{vfTr("uiActCancel", "取消")}}</button>
                <button data-requires-js hidden type="submit" class="btn btn-primary">{{vfTr("attrSaveValues", "保存属性值")}}</button>
            </div>
        </form>
        <p class="form-hint" data-write-status role="status" hidden></p>
        </div>
