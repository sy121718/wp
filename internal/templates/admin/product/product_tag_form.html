
{{tr := .["t"]}}
{{tf := .["tf"]}}
{{create := !isset(.Entity)}}
{{entity := map("ID", "", "Name", "", "Slug", "", "Kind", "manual", "Sort", 0, "RuleType", "")}}{{if !create}}{{entity = .Entity}}{{end}}
{{kind := entity.Kind}}
        <div data-write-host>

        <form data-write="custom" data-write-url="/api/product/tag/{{if create}}create{{else}}update{{end}}" class="form-stack" data-write-close="[data-drawer]"
              data-write-object=".tag-rule-fields;ruleParams;ruleType;kind=rule">
            <input type="hidden" name="projectId" value="{{.Project}}">
            {{if !create}}<input type="hidden" name="id" value="{{entity.ID}}">{{end}}
            <div class="form-inline">
                <input aria-label="{{tr("admin.product_tags.label.name", "标签名称")}}" class="form-input" type="text" name="name" value="{{entity.Name}}" placeholder="{{tr("admin.product_tags.label.name", "标签名称")}}" required>
                <input aria-label="{{tr("admin.product_tags.label.slug", "URL 段")}}" class="form-input" type="text" name="slug" value="{{entity.Slug}}" placeholder="{{tr("admin.product_tags.label.slug", "URL 段")}}" autocomplete="off">
                <select class="form-select" name="kind" aria-label="{{tr("admin.product_tags.label.kind", "类型")}}">
                    <option value="manual" {{if kind == "manual"}}selected{{end}}>{{tr("admin.product_tags.kindManual", "手工标签")}}</option>
                    <option value="rule" {{if kind == "rule"}}selected{{end}}>{{tr("admin.product_tags.kindRule", "自动标签（按规则）")}}</option>
                </select>
                <input aria-label="{{tr("admin.product_tags.ph.sort", "排序")}}" class="form-input" type="number" name="sort" value="{{entity.Sort}}" placeholder="{{tr("admin.product_tags.ph.sort", "排序")}}" inputmode="numeric" step="1">
            </div>

            <div class="form-inline tag-rule-fields">
                <select class="form-select" name="ruleType" aria-label="{{tr("admin.product_tags.label.rule", "规则")}}">
                    <option value="" {{if entity.RuleType == ""}}selected{{end}}>{{tr("admin.product_tags.ruleEmpty", "（手工标签留空）")}}</option>
                    {{range i, r := .RuleTypes}}<option value="{{r.Type}}" data-rule-keys="{{range j, k := r.ParamKeys}}{{if j}},{{end}}{{k}}{{end}}" {{if r.Type == entity.RuleType}}selected{{end}}>{{if r.Type == "new_arrival"}}{{tr("admin.product_tags.rule.newArrival.name", "新品（上架 N 天内）")}}{{else if r.Type == "price_range"}}{{tr("admin.product_tags.rule.priceRange.name", "价格区间（存在启用变体落在区间内）")}}{{else if r.Type == "on_sale"}}{{tr("admin.product_tags.rule.onSale.name", "促销（有划线价）")}}{{else}}{{r.Type}}{{end}}</option>{{end}}
                </select>
                <input aria-label="{{tr("admin.product_tags.ph.days", "days（上架 N 天内，1~365）")}}" class="form-input" type="number" name="days" value="{{if !create}}{{if entity.RuleValues.HasDays}}{{entity.RuleValues.Days}}{{end}}{{end}}" placeholder="{{tr("admin.product_tags.ph.daysShort", "days（1~365）")}}" inputmode="numeric" min="1" max="365" step="1">
                <input aria-label="minPrice" class="form-input" type="text" name="minPrice" value="{{if !create}}{{if entity.RuleValues.HasMinPrice}}{{entity.RuleValues.MinPrice}}{{end}}{{end}}" placeholder="minPrice" inputmode="decimal" autocomplete="off">
                <input aria-label="maxPrice" class="form-input" type="text" name="maxPrice" value="{{if !create}}{{if entity.RuleValues.HasMaxPrice}}{{entity.RuleValues.MaxPrice}}{{end}}{{end}}" placeholder="maxPrice" inputmode="decimal" autocomplete="off">
            </div>
            <div class="action-row">
                <button type="button" class="btn btn-ghost" data-drawer-close>{{tr("admin.common.action.cancel", "取消")}}</button>
                <button data-requires-js hidden type="submit" class="btn btn-primary">{{if create}}{{tr("admin.product_tags.create.submit", "新建标签")}}{{else}}{{tr("admin.product_tags.list.save", "保存标签")}}{{end}}</button>
            </div>
        </form>
        <p class="form-hint" data-write-status role="status" hidden></p>
        </div>
