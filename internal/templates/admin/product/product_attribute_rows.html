{{tr := .["t"]}}
<div data-attribute-values>
<div data-attribute-value-list>
{{if isset(.Values)}}{{range _, value := .Values}}
<div class="attr-value-row" data-attribute-value-row>
<input data-attribute-field="id" type="hidden" value="{{value.ID}}">
<input data-attribute-field="key" class="form-input" value="{{value.Key}}" aria-label="{{tr("attrKeyCol", "标识")}}">
<input data-attribute-field="label" class="form-input" value="{{value.Label}}" required aria-label="{{tr("attrValueLabel", "显示名")}}">
<input data-attribute-field="sort" class="form-input" type="number" value="{{value.Sort}}" aria-label="{{tr("attrValsSort", "排序")}}">
<label><input data-attribute-field="enabled" type="checkbox" {{if value.Enabled}}checked{{end}}> {{tr("attrValsOn", "启用")}}</label>
<button type="button" class="btn btn-sm" data-attribute-remove>{{tr("uiActDel", "删除")}}</button>
</div>
{{end}}{{end}}
</div>
<template data-attribute-prototype>
<div class="attr-value-row" data-attribute-value-row>
<input data-attribute-field="id" type="hidden" value="">
<input data-attribute-field="key" class="form-input" value="" aria-label="{{tr("attrKeyCol", "标识")}}">
<input data-attribute-field="label" class="form-input" value="" required aria-label="{{tr("attrValueLabel", "显示名")}}">
<input data-attribute-field="sort" class="form-input" type="number" value="0" aria-label="{{tr("attrValsSort", "排序")}}">
<label><input data-attribute-field="enabled" type="checkbox" checked> {{tr("attrValsOn", "启用")}}</label>
<button type="button" class="btn btn-sm" data-attribute-remove>{{tr("uiActDel", "删除")}}</button>
</div>
</template>
<button type="button" class="btn btn-sm" data-attribute-add>+ {{tr("attrValsAdd", "添加值")}}</button>
</div>
