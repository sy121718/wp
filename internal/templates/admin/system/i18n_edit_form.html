{* 编辑片段只交一份 Jet 表单；失败留在错误区，成功关闭并刷新原列表。 *}
<form data-drawer-fragment hx-post="/api/i18n/save" hx-target="find [data-write-result]" hx-swap="innerHTML"
      hx-sync="this:drop" hx-disable="findAll button:not(:disabled)"
      data-write="update" data-write-close="[data-drawer]" data-write-reload>
    <input type="hidden" name="action" value="update">
    <p class="form-hint" data-write-status role="alert" hidden></p>
    <div data-write-result></div>
    <div class="form-grid">
        <div class="form-field">
            <label class="form-label">key</label>
            <input type="text" class="form-input" name="key" value="{{.Key}}" readonly required>
        </div>
        <div class="form-field">
            <label class="form-label">{{t("admin.i18n.label.lang", "语言")}}</label>
            <input type="text" class="form-input" name="lang" value="{{.Lang}}" readonly required>
        </div>
        <div class="form-field form-field--wide">
            <label class="form-label">{{t("admin.i18n.label.value", "内容")}}</label>
            <textarea name="value" class="form-textarea" rows="3" required>{{.Value}}</textarea>
        </div>
        <div class="form-field">
            <label class="form-label">{{t("admin.i18n.label.category", "分类")}}</label>
            <input type="text" class="form-input" name="category" value="{{.Category}}">
        </div>
        <div class="form-field">
            <label class="form-label">{{t("admin.i18n.label.remark", "备注")}}</label>
            <input type="text" class="form-input" name="remark" value="{{.Remark}}">
        </div>
    </div>
    <div class="action-row">
        <button type="button" class="btn btn-ghost" data-drawer-close>{{t("admin.common.action.cancel", "取消")}}</button>
        <button data-requires-js hidden type="submit" class="btn btn-primary">{{t("admin.i18n.action.save", "保存")}}</button>
    </div>
</form>
