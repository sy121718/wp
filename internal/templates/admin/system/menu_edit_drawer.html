{{m := .MenuEdit}}
<form data-drawer-fragment method="post" action="/admin/menus/update"
      hx-post="/admin/menus/update" hx-target="find [data-write-result]" hx-swap="innerHTML"
      hx-sync="this:drop" hx-disable="findAll button:not(:disabled)"
      data-write="update" data-write-close="[data-drawer]" data-write-reload>
    <p class="form-hint" data-write-status role="status" hidden></p>
    <div data-write-result hidden></div>
    <input type="hidden" name="id" value="{{m.ID}}">
    <div class="form-group">
        <label class="form-label req" for="menu-edit-title">{{t("admin.menus.field.title", "菜单标题")}}</label>
        <input id="menu-edit-title" type="text" name="title" class="form-input" required maxlength="50" value="{{m.Title}}">
    </div>
    <div class="form-group">
        <label class="form-label" for="menu-edit-parent">{{t("admin.menus.field.parent", "上级菜单")}}</label>
        <select id="menu-edit-parent" name="parent_id" class="form-select">
            <option value="0"{{if m.ParentID == 0}} selected{{end}}>{{t("admin.menus.parent_root", "（根菜单）")}}</option>
            {{range _, p := .Parents}}
            <option value="{{p.ID}}" data-type="{{p.Type}}"{{if p.Disabled}} disabled{{end}}{{if p.ID == m.ParentID}} selected{{end}}>{{p.Indent}}{{p.Title}}</option>
            {{end}}
        </select>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label class="form-label req" for="menu-edit-type">{{t("admin.menus.field.type", "类型")}}</label>
            <select id="menu-edit-type" name="type" class="form-select">
                <option value="1"{{if m.Type == 1}} selected{{end}}>{{t("admin.menus.type.dir", "目录")}}</option>
                <option value="2"{{if m.Type == 2}} selected{{end}}>{{t("admin.menus.type.menu", "菜单")}}</option>
                <option value="3"{{if m.Type == 3}} selected{{end}}>{{t("admin.menus.type.button", "按钮")}}</option>
                <option value="4"{{if m.Type == 4}} selected{{end}}>iframe</option>
                <option value="5"{{if m.Type == 5}} selected{{end}}>{{t("admin.menus.type.link", "外链")}}</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="menu-edit-status">{{t("admin.menus.field.status", "状态")}}</label>
            <select id="menu-edit-status" name="status" class="form-select">
                <option value="1"{{if m.Status == 1}} selected{{end}}>{{t("admin.menus.status.enabled", "启用")}}</option>
                <option value="0"{{if m.Status == 0}} selected{{end}}>{{t("admin.menus.status.disabled", "禁用")}}</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="form-label" for="menu-edit-path">{{t("admin.menus.field.path", "路径")}}</label>
        <input id="menu-edit-path" type="text" name="path" class="form-input" maxlength="100" value="{{m.Path}}">
    </div>
    {{include "menu_perm_field.html"}}
    <div class="form-group">
        <label class="form-label">{{t("admin.menus.field.icon", "图标")}}</label>
        <div data-icon-field></div>
        <input type="hidden" name="icon" value="{{m.Icon}}">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label class="form-label" for="menu-edit-sort">{{t("admin.menus.field.sort", "排序")}}</label>
            <input id="menu-edit-sort" type="number" name="sort_order" class="form-input" value="{{m.SortOrder}}">
        </div>
        <div class="form-group">
            <label class="form-label" for="menu-edit-remark">{{t("admin.menus.field.remark", "备注")}}</label>
            <input id="menu-edit-remark" type="text" name="remark" class="form-input" maxlength="200" value="{{m.Remark}}">
        </div>
    </div>
    <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-drawer-close>{{t("admin.menus.action.cancel", "取消")}}</button>
        <button data-requires-js hidden type="submit" class="btn btn-primary">{{t("admin.menus.save_submit", "保存修改")}}</button>
    </div>
</form>
