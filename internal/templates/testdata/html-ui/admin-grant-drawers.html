<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="browser-csrf">
    <link rel="stylesheet" href="/static/css/ui.css">
    <title>系统授权抽屉验收</title>
</head>
<body>
    <button id="admin-role" type="button" data-drawer-open hx-get="/admin/administrators/roles/drawer?user_id=42" hx-target="#admin-drawer-body" hx-swap="innerHTML" data-drawer-title="管理员角色">管理员角色</button>
    <button id="admin-menu" type="button" data-drawer-open hx-get="/admin/administrators/menus/drawer?user_id=42" hx-target="#admin-drawer-body" hx-swap="innerHTML" data-drawer-title="管理员菜单">管理员菜单</button>
    <button id="role-menu" type="button" data-drawer-open hx-get="/admin/roles/permissions/drawer?role_id=7" hx-target="#admin-drawer-body" hx-swap="innerHTML" data-drawer-title="角色权限">角色权限</button>
    <div class="drawer-mask" data-drawer-mask hidden></div>
    <aside class="drawer" data-drawer data-write-host hidden>
        <header><span data-drawer-title></span><button type="button" data-drawer-close>关闭</button></header>
        <div data-write-status role="alert" hidden></div>
        <div id="admin-drawer-body" class="drawer-body" data-drawer-body></div>
    </aside>
    <script src="/static/js/ui/htmx.min.js"></script>
    <script src="/static/js/ui/write-base.js"></script>
    <script src="/static/js/ui/htmx-bridge.js"></script>
    <script src="/static/js/ui/_util.js"></script>
    <script src="/static/js/ui/drawer.js"></script>
    <script src="/static/js/ui/perm-tree.js"></script>
    <script src="/static/js/ui/index.js"></script>
</body>
</html>
