<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/ui.css">
    <title>{{t("fixture.title", "HTML 交互验收")}}</title>
</head>
<body>
    <section data-write-host>
        <form id="main" data-write hx-post="/write/form" hx-target="#result" hx-swap="innerHTML" hx-sync="this:drop" hx-disable="findAll button:not(:disabled)">
            {{include "fields.html"}}
        </form>
        <div id="result">original</div>
    </section>
    <input form="main" name="external" value="outside">
    <section data-write-host>
        <button id="read" type="button" hx-get="/fragment" hx-target="#result" hx-swap="innerHTML">{{t("fixture.read", "查询")}}</button>
        <div data-write-status hidden></div>
    </section>
    <button id="open" type="button" data-drawer-open="#edit-template">{{t("fixture.open", "打开抽屉")}}</button>
    <template id="edit-template">
        <form data-write data-write-close="[data-drawer]" hx-post="/write/form" hx-target="#result" hx-swap="innerHTML" hx-sync="this:drop" hx-disable="findAll button:not(:disabled)">
            {{include "fields.html"}}
        </form>
    </template>
    <div class="drawer-mask" data-drawer-mask hidden></div>
    <button id="remote" type="button" data-drawer-open hx-get="/drawer" hx-target="#remote-body" hx-swap="innerHTML">{{t("fixture.open", "打开抽屉")}}</button>
    <aside class="drawer" data-drawer data-write-host hidden>
        <header><span data-drawer-title>{{t("fixture.edit", "编辑")}}</span><button type="button" data-drawer-close>{{t("fixture.close", "关闭")}}</button></header>
        <div id="drawer-error" data-write-status role="alert" hidden></div>
        <div id="remote-body" class="drawer-body" data-drawer-body></div>
    </aside>
    <script src="/static/js/ui/htmx.min.js"></script>
    <script src="/static/js/ui/write-base.js"></script>
    <script src="/static/js/ui/htmx-bridge.js"></script>
    <script src="/static/js/ui/_util.js"></script>
    <script src="/static/js/ui/select.js"></script>
    <script src="/static/js/ui/drawer.js"></script>
    <script src="/static/js/ui/index.js"></script>
</body>
</html>
