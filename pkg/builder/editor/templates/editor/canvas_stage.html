{* editor/canvas_stage.html — 中央画布（通用编辑器区域）。
   预览地址、文档数据与模拟状态由宿主提供的 bootstrap 决定，模板只声明结构。 *}
<section class="wb-stage">
    <div class="wb-canvas-toolbar"><div class="wb-breadcrumb"><span>{{ .["t"]("workbench.ui.canvas.page", "页面") }}</span><span>/</span><strong id="wb-device-label">{{ .["t"]("workbench.ui.canvas.responsive", "响应式") }}</strong><span id="wb-selection-label"></span></div><div class="wb-canvas-tools"><label id="wb-preview-states" class="wb-preview-states" hidden><span>{{ .["t"]("workbench.ui.editor.preview-label", "模拟预览") }}</span><select id="wb-preview-state"><option value="default">{{ .["t"]("workbench.ui.editor.state.default", "正常") }}</option><option value="loading">{{ .["t"]("workbench.ui.editor.state.loading", "加载中") }}</option><option value="empty">{{ .["t"]("workbench.ui.editor.state.empty", "空内容") }}</option><option value="unauthenticated">{{ .["t"]("workbench.ui.editor.state.unauthenticated", "未登录") }}</option><option value="validation-error">{{ .["t"]("workbench.ui.editor.state.validation-error", "输入错误") }}</option><option value="service-error">{{ .["t"]("workbench.ui.editor.state.service-error", "服务失败") }}</option><option value="submitting">{{ .["t"]("workbench.ui.editor.state.submitting", "提交中") }}</option><option value="success">{{ .["t"]("workbench.ui.editor.state.success", "成功") }}</option><option value="out-of-stock">{{ .["t"]("workbench.ui.editor.state.out-of-stock", "缺货") }}</option><option value="variant-required">{{ .["t"]("workbench.ui.editor.state.variant-required", "未选规格") }}</option><option value="forbidden">{{ .["t"]("workbench.ui.editor.state.forbidden", "无权限") }}</option><option value="not-found">{{ .["t"]("workbench.ui.editor.state.not-found", "不存在") }}</option></select></label><span class="wb-canvas-hint">{{ .["t"]("workbench.ui.canvas.directHint", "双击文字直接编辑") }}</span><button type="button" class="wb-btn wb-btn-ghost wb-btn-sm" id="wb-navigator-toggle" aria-pressed="false"><span data-wb-icon="layers" aria-hidden="true"></span>{{ .["t"]("workbench.ui.tree.pageStructure", "页面结构") }}</button></div></div>
    <div class="wb-canvas-wrap">
    <div class="wb-canvas-frame" id="wb-canvas-frame">
        <iframe id="wb-canvas" name="wb-canvas" title="{{ .["t"]("workbench.ui.canvas.title", "画布") }}" src="{{if isset(.previewURL)}}{{ .previewURL }}{{else}}about:blank{{end}}"></iframe>
    </div>
    </div>
</section>
