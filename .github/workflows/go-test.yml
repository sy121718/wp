name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # 纯文件扫描的静态检查：不需要数据库，秒级完成，放在最前面 ——
      # 它们拦的是「评审时看不出来」的回归（内部错误直出会让表名/SQL/路径上屏；
      # 硬编码文案会让后台在非默认语言下显示中文）。这类问题一旦进门，
      # 就只能靠人工逐页翻，所以宁可让 CI 早失败。
      - name: Static checks (no external services)
        run: |
          scripts/check-no-internal-error-leak.sh
          scripts/check-i18n-coverage.sh
      - name: Unit tests (no external services)
        run: |
          go test ./pkg/... ./internal/builder/... ./internal/pipeline/... \
            ./internal/module/order/service/... \
            ./internal/module/page/enums/... \
            -count=1 -timeout 10m

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: base
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/base?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Feature tests
        # -p 1：与 Makefile 的 test 目标同口径。feature 测试各自建隔离 schema 跑同一套迁移，
        # 而 pg_trgm 是**库级唯一**的扩展 —— 并行时一个 schema 装上了，另一个 schema 的
        # CREATE EXTENSION IF NOT EXISTS 会静默空转，随后 gin_trgm_ops 解析失败、整条迁移报错。
        run: go test -p 1 ./public/test/... -count=1 -timeout 30m
        continue-on-error: true
