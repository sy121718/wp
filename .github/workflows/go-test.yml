name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 两个 job 的分工：
#   unit        —— 无外部服务、秒级反馈：静态检查 + 除 public/test 外的全部包。
#                  需要 PG/Redis 的用例按测试基建的既有约定自行 t.Skip。
#   integration —— 起真的 PostgreSQL 16 + Redis 7，跑全量（含 public/test）。
#                  这一层是门禁：**没有 continue-on-error**，红了就是红。
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Static checks (no external services)
        # 纯文件扫描，不需要数据库，秒级完成 ——
        # 它们拦的是「评审时看不出来」的回归（内部错误直出会让表名/SQL/路径上屏；
        # 硬编码文案会让后台在非默认语言下显示中文）。这类问题一旦进门，
        # 就只能靠人工逐页翻，所以宁可让 CI 早失败。
        run: |
          scripts/check-no-internal-error-leak.sh
          scripts/check-i18n-coverage.sh
          scripts/check-service-db-boundary.sh
          # 多端硬规则守卫（审计 UI-015）：裸 :hover / 写死 px 宽度 / 有 hover 桶无触屏等价形态 /
          # clamp 下界超最窄视口。当前是 warn —— 只打印全量违规清单，不拦（整改是后续批次）。
          # 整改完成后把 SKY_CSS_GUARD 改成 error：同一个脚本立刻变成硬门禁，且构建路径上的产物
          # 守卫（Compile 内的 guardProductCSS）一并生效，不再需要改脚本与构建代码。
          SKY_CSS_GUARD=warn scripts/check-multidevice-css.sh
      - name: Unit tests (no external services)
        # 覆盖范围以前是逐个包列举（pkg / builder / pipeline / order/service /
        # page/enums），漏掉了 30 个含测试的包 —— 其中有迁移判据、retention 目录
        # 不变量、路由装配断言这些**护栏**，恰好是最该被 CI 盯住的一批。
        # 现在按目录整体覆盖：新增包自动纳入，不需要记得回来改这里。
        run: |
          go test ./pkg/... ./internal/... ./cmd/... ./config/... \
            ./public/migrations/... -count=1 -timeout 10m

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # 与 config.yaml.example 的 database 段默认值对齐（127.0.0.1:5432 / root / wp）：
          # 测试基建 public/test/support/pgtest.go 走 libpq 的 PGHOST/PGUSER/...，
          # 默认值正是这一组。对齐之后测试直接连服务容器，不再回退 testcontainers ——
          # 那条路在 CI 上慢，且失败时表现为「用例被 skip」，看着像通过。
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d wp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 密码与密钥走环境变量注入（config.envBindableKeys），
      # 因此可以直接用仓库里的 config.yaml.example，不必在 CI 里改配置文件内容。
      GOWP_DATABASE_PASSWORD: root
      GOWP_AUTH_SESSION_SECRET: ci-session-secret-not-for-production-use
      GOWP_APP_SECRET: 9f2c1a7b4e6d8f0a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e0f2a4b6c8d0e1f3a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare config and test database
        run: |
          cp config.yaml.example config.yaml
          # 测试基建连的库名是 wp_test（pgtest.go 的 DefaultPGDatabase）：它作为
          # 「管理库」用来 CREATE DATABASE ... TEMPLATE 复制模板库，自身不需要结构。
          PGPASSWORD=root psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE wp_test'
      - name: Migrate schema and seeds
        # 有几个用例走 SetupTestBootstrap（真实 config + 全组件装配），它们连的是
        # config.yaml 里的 wp 库，因此该库必须先有完整结构。此前没有这一步，
        # 这些用例在 CI 上连的是空库，失败被 continue-on-error 吞掉了。
        run: go run ./cmd -migrate-only
      - name: Permission point audit
        # 有路由、没有对应权限点 = 含超管在内全员 403（072/077/078/079/151 各踩过一次）。
        # 这条检查要连库比对「运行时装配出来的路由表」与 sys_permission，所以只能在有 PG 的
        # 这一层跑，且必须排在 Migrate 之后（权限点由 seed 写入）。
        run: bash scripts/check-permission-gaps.sh
      - name: Full suite (real PostgreSQL + Redis)
        # -p 4：runner 核数少，保守取值。本地 16 核实测 -p 16 约 65s。
        run: go test -p 4 ./... -count=1 -timeout 30m
