name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 两个 job 的分工：
#   unit        —— 无外部服务、秒级反馈：静态检查 + 除 public/test 外的全部包。
#                  需要 PG/Redis 的用例按测试基建的既有约定自行 t.Skip。
#   integration —— 起真的 PostgreSQL 16 + Redis 7，跑全量（含 public/test）。
#                  这一层是门禁：**没有 continue-on-error**，红了就是红。
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Static checks (no external services)
        # 统一入口：scripts/check-all.sh 的 PLAIN_SCRIPTS 组，与本地 `make check` 是同一份清单。
        # 之前这里是手写子集（CI 6 个 / Makefile 3 个），而 scripts/ 下还有几个脚本
        # **从未被任何自动流程调用** —— 没人调用的检查永远不会变红（审计 R-02/R-03）。
        # 新增脚本只加进 check-all.sh 的数组，不需要回来改这里。
        #   · no-internal-error-leak：内部错误直出（表名/SQL/路径上屏）
        #   · i18n-coverage / i18n-keys-seeded：硬编码文案；key 被用但没 seed（唯一来源是迁移 seed，
        #     漏了只会静默回落中文，切 en-US 才看得见）
        #   · service-db-boundary：跨模块裸 DB 句柄
        #   · page-endpoint-authz：页面写端点漏挂 Casbin（审计 H3 —— 页面组没有鉴权判定链）
        #   · multidevice-css：多端硬规则（入口统一设 SKY_CSS_GUARD=error，未豁免违规即失败）
        #   · empty-state-table-head / inventory-sku-format / stock-sku-prefix-collisions / workbench
        run: scripts/check-all.sh
      - name: Unit tests (no external services)
        # 覆盖范围以前是逐个包列举（pkg / builder / pipeline / order/service /
        # page/enums），漏掉了 30 个含测试的包 —— 其中有迁移判据、retention 目录
        # 不变量、路由装配断言这些**护栏**，恰好是最该被 CI 盯住的一批。
        # 现在按目录整体覆盖：新增包自动纳入，不需要记得回来改这里。
        run: |
          go test ./pkg/... ./internal/... ./cmd/... ./config/... \
            ./public/migrations/... -count=1 -timeout 10m
      - name: Race detector (core five areas)
        # 竞态既不会编译失败也不会让普通 go test 变红 —— 只能靠 -race 抓。
        # 本机 16 核实测这条命令约 1 分钟（73 包，0 DATA RACE），换来 publication /
        # presentation 这类多 goroutine 路径的真实覆盖（评审 R-04）。与本地
        # `make test-race` 是同一组包与参数。
        run: make test-race

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # 与 config.yaml.example 的 database 段默认值对齐（127.0.0.1:5432 / root / wp）：
          # 测试基建 public/test/support/pgtest.go 走 libpq 的 PGHOST/PGUSER/...，
          # 默认值正是这一组。对齐之后测试直接连服务容器，不再回退 testcontainers ——
          # 那条路在 CI 上慢，且失败时表现为「用例被 skip」，看着像通过。
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d wp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 密码与密钥走环境变量注入（config.envBindableKeys），
      # 因此可以直接用仓库里的 config.yaml.example，不必在 CI 里改配置文件内容。
      GOWP_DATABASE_PASSWORD: root
      GOWP_AUTH_SESSION_SECRET: ci-session-secret-not-for-production-use
      GOWP_APP_SECRET: 9f2c1a7b4e6d8f0a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e0f2a4b6c8d0e1f3a
      # 「跳过」与「通过」必须可分辨（审计 R-05）：这一层起了真 PostgreSQL + Redis，
      # 依赖不可用就该红，而不是把整包用例 t.Skip 掉、看着像绿。
      # public/test/support/require_env.go 据此把 skip 变成 fail（这两个变量未设置时保持原语义，
      # 所以 unit job 与本地裸跑不受影响）。
      GOWP_REQUIRE_PG: "1"
      GOWP_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare config and test database
        run: |
          cp config.yaml.example config.yaml
          # 测试基建连的库名是 wp_test（pgtest.go 的 DefaultPGDatabase）：它作为
          # 「管理库」用来 CREATE DATABASE ... TEMPLATE 复制模板库，自身不需要结构。
          PGPASSWORD=root psql -h 127.0.0.1 -U root -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE wp_test'
      - name: Migrate schema and seeds
        # 有几个用例走 SetupTestBootstrap（真实 config + 全组件装配），它们连的是
        # config.yaml 里的 wp 库，因此该库必须先有完整结构。此前没有这一步，
        # 这些用例在 CI 上连的是空库，失败被 continue-on-error 吞掉了。
        run: go run ./cmd -migrate-only
      - name: Database-backed gates
        # 有路由、没有对应权限点 = 含超管在内全员 403（072/077/078/079/151 各踩过一次）。
        # 这条检查要连库比对「运行时装配出来的路由表」与 sys_permission，所以只能在有 PG 的
        # 这一层跑，且必须排在 Migrate 之后（权限点由 seed 写入）。
        # 走统一入口的 db 模式：与 `make check-db` 同一条清单，避免本地与 CI 各跑一半。
        run: bash scripts/check-all.sh --db-only
      - name: Route table snapshot
        # 装配重构（审计 CQ-008）的安全网。SetupRoutes 是约 700 行的线性装配，人眼 review
        # 看不出「少挂了一行中间件」或「某个 group 换了父节点」这类漂移 —— 它们不会编译失败，
        # 只表现为「某个接口突然不用鉴权」或「某条路径 404」。有意的路由增删要显式更新快照
        # （WP_DUMP_ROUTES=write），这样任何未预期的路由变化都会在 CI 里被挡下来。
        run: WP_DUMP_ROUTES=1 go test ./internal/routers/ -run TestRouteSnapshotStable -count=1
      - name: Full suite (real PostgreSQL + Redis)
        # -p 4：runner 核数少，保守取值。本地 16 核实测 -p 16 约 65s。
        # 顺带守「跳过 ≠ 通过」：GOWP_REQUIRE_PG/REDIS=1 之下，任何用例因环境不可用被跳过
        # 都要让这一层红 —— 否则一次环境抖动就会把整批集成用例变成静默空跑（评审 R-05）。
        run: |
          set -o pipefail
          go test -p 4 -v ./... -count=1 -timeout 30m 2>&1 | tee /tmp/integration.log
          if grep -qE '本地 PostgreSQL 不可用|本地 Redis 不可用|Redis 不可用' /tmp/integration.log; then
            echo "::error::GOWP_REQUIRE_PG/REDIS 已开启，仍有用例因环境不可用被跳过"
            exit 1
          fi
