name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # 纯文件扫描的静态检查：不需要数据库，秒级完成，放在最前面 ——
      # 它们拦的是「评审时看不出来」的回归（内部错误直出会让表名/SQL/路径上屏；
      # 硬编码文案会让后台在非默认语言下显示中文）。这类问题一旦进门，
      # 就只能靠人工逐页翻，所以宁可让 CI 早失败。
      - name: Static checks (no external services)
        run: |
          scripts/check-no-internal-error-leak.sh
          scripts/check-i18n-coverage.sh
      - name: Unit tests (no external services)
        run: |
          go test ./pkg/... ./internal/builder/... ./internal/pipeline/... \
            ./internal/module/order/service/... \
            ./internal/module/page/enums/... \
            -count=1 -timeout 10m

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: base
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/base?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Feature tests
        # -p 4：pg_trgm 固定到 ext_shared、迁移锁按 schema 派生、迁移固定在单连接，且测试
        # 改为复制模板库（不再各自重跑 209 条迁移）—— 并发不再互相踩，也不再撑爆锁表。
        # 本地 16 核实测 -p 8 为 271s；runner 核数少，这里保守取 4。
        run: go test -p 4 ./public/test/... -count=1 -timeout 30m
        continue-on-error: true
