<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery 组件测试</title>
    <link rel="stylesheet" href="/static/builder/css/preview.css">
    <style>
        body {
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .test-section {
            margin: 2rem 0;
            padding: 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }
        h2 { margin-top: 0; }
        pre {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Gallery 组件测试</h1>
    
    <div class="test-section">
        <h2>测试 1：默认 Gallery（3张图片）</h2>
        <div id="test1"></div>
    </div>
    
    <div class="test-section">
        <h2>测试 2：单张图片 Gallery</h2>
        <div id="test2"></div>
    </div>
    
    <div class="test-section">
        <h2>测试 3：轮播模式 Gallery</h2>
        <div id="test3"></div>
    </div>
    
    <div class="test-section">
        <h2>测试 4：空 URL Gallery（应显示占位符）</h2>
        <div id="test4"></div>
    </div>

    <script src="/static/builder/js/registry.js"></script>
    <script src="/static/builder/js/renderer.js"></script>
    <script>
        // 测试 1：默认 Gallery
        const node1 = BuilderRegistry.createNode('gallery');
        console.log('Test 1 - 默认节点:', node1);
        document.getElementById('test1').innerHTML = BuilderRenderer.renderNode(node1);
        
        // 测试 2：单张图片
        const node2 = BuilderRegistry.createNode('gallery');
        node2.props.images = [
            { src: 'https://via.placeholder.com/800x600/3b82f6/ffffff?text=Single+Image', alt: '单张图片' }
        ];
        console.log('Test 2 - 单张图片:', node2);
        document.getElementById('test2').innerHTML = BuilderRenderer.renderNode(node2);
        
        // 测试 3：轮播模式
        const node3 = BuilderRegistry.createNode('gallery');
        node3.props.mode = 'carousel';
        console.log('Test 3 - 轮播模式:', node3);
        document.getElementById('test3').innerHTML = BuilderRenderer.renderNode(node3);
        
        // 测试 4：空 URL（应显示占位符）
        const node4 = BuilderRegistry.createNode('gallery');
        node4.props.images = [
            { src: '', alt: '空图片1' },
            { src: '', alt: '空图片2' }
        ];
        console.log('Test 4 - 空 URL:', node4);
        document.getElementById('test4').innerHTML = BuilderRenderer.renderNode(node4);
        
        // 检查图片加载
        setTimeout(() => {
            const images = document.querySelectorAll('.cmp-gallery img');
            console.log('页面中的图片元素数量:', images.length);
            images.forEach((img, i) => {
                console.log(`图片 ${i + 1}:`, {
                    src: img.src,
                    complete: img.complete,
                    naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight
                });
            });
        }, 2000);
    </script>
</body>
</html>
